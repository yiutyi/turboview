name: cpu-shell CI

on:
  workflow_dispatch:
  push:
    branches: [main, "cpu-shell/**"]
    paths:
      - "cpu-shell/**"
      - ".github/workflows/cpu-shell-ci.yml"
  pull_request:
    paths:
      - "cpu-shell/**"
      - ".github/workflows/cpu-shell-ci.yml"

permissions:
  contents: read

concurrency:
  group: cpu-shell-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Add vendored NASM to PATH
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE\turboview\third-party\nasm\nasm-2.16.03" >> $env:GITHUB_PATH

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cpu-shell

      - name: Configure libjpeg-turbo
        run: >
          cmake -G Ninja -S . -B build-turbo
          -DCMAKE_BUILD_TYPE=Release
          -DWITH_SIMD=ON
          -DWITH_TURBOJPEG=ON
          -DENABLE_SHARED=OFF
          -DENABLE_STATIC=ON
          -DWITH_CRT_DLL=ON
          -DWITH_JAVA=OFF
          -DWITH_FUZZ=OFF
          -DWITH_TOOLS=OFF
          -DWITH_TESTS=OFF

      - name: Build libjpeg-turbo static library
        run: cmake --build build-turbo --config Release --target turbojpeg-static --parallel 4

      - name: Run tests
        working-directory: cpu-shell
        run: cargo test --release

      - name: Build release binary
        working-directory: cpu-shell
        run: cargo build --release

      - name: Headless window smoke test
        working-directory: cpu-shell
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $env:TV_OPEN = "$env:GITHUB_WORKSPACE\cpu-shell\assets\test-64.jpg"
          $env:TV_DEMO = "1"
          $env:TV_DUMP_DIR = "$env:GITHUB_WORKSPACE\dump"
          $env:TV_EXIT_MS = "3000"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\dump" | Out-Null
          .\target\release\turboview-cpu.exe
          Get-ChildItem "$env:GITHUB_WORKSPACE\dump" | Select-Object Name,Length

  linux:
    name: Linux (libjpeg-turbo SIMD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm cmake ninja-build libx11-dev libx11-xcb-dev libxkbcommon-dev xvfb

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cpu-shell

      - name: Configure libjpeg-turbo
        run: >
          cmake -G Ninja -S . -B build-turbo-linux
          -DCMAKE_BUILD_TYPE=Release
          -DWITH_SIMD=ON
          -DWITH_TURBOJPEG=ON
          -DENABLE_SHARED=OFF
          -DENABLE_STATIC=ON
          -DWITH_JAVA=OFF
          -DWITH_FUZZ=OFF
          -DWITH_TOOLS=OFF
          -DWITH_TESTS=OFF

      - name: Build libjpeg-turbo static library
        run: cmake --build build-turbo-linux --target turbojpeg-static --parallel 4

      - name: Run tests
        working-directory: cpu-shell
        run: cargo test --release

      - name: Build release binary
        working-directory: cpu-shell
        run: cargo build --release

      - name: Headless window smoke test
        working-directory: cpu-shell
        continue-on-error: true
        run: |
          mkdir -p dump
          TV_OPEN="$GITHUB_WORKSPACE/cpu-shell/assets/test-64.jpg" \
          TV_DEMO=1 TV_DUMP_DIR="$GITHUB_WORKSPACE/cpu-shell/dump" TV_EXIT_MS=3000 \
            xvfb-run -a --server-args="-screen 0 1280x800x24" ./target/release/turboview-cpu
          ls -l dump

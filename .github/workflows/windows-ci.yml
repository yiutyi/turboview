name: Windows Rust CI

on:
  push:
    branches: [main, "perf/**"]
  pull_request:
    branches: [main]
    paths:
      - "turboview/**"
      - ".github/workflows/windows-ci.yml"

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: turboview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Add vendored NASM to PATH
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE\turboview\third-party\nasm\nasm-2.16.03" >> $env:GITHUB_PATH

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: turboview

      - name: Configure libjpeg-turbo
        working-directory: .
        run: >
          cmake -G Ninja -S . -B build-turbo
          -DCMAKE_BUILD_TYPE=Release
          -DWITH_SIMD=ON
          -DWITH_TURBOJPEG=ON
          -DENABLE_SHARED=OFF
          -DENABLE_STATIC=ON
          -DWITH_CRT_DLL=ON
          -DWITH_JAVA=OFF
          -DWITH_FUZZ=OFF
          -DWITH_TOOLS=OFF
          -DWITH_TESTS=OFF

      - name: Build libjpeg-turbo static library
        working-directory: .
        run: cmake --build build-turbo --config Release --target turbojpeg-static --parallel 4

      - name: Compile experimental WIC decoder
        run: cargo check --features wic-decode --locked

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build release application
        run: cargo build --release --locked

      - name: Build path storage benchmark
        run: cargo build --release --bin pathbench --locked

      - name: Assemble portable package
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:RUNNER_TEMP "TurboView-portable"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $exe = Join-Path $env:GITHUB_WORKSPACE "turboview\target\release\turboview.exe"
          if (!(Test-Path $exe)) { throw "Release executable not found: $exe" }
          Copy-Item $exe $dist
          $bench = Join-Path $env:GITHUB_WORKSPACE "turboview\target\release\pathbench.exe"
          if (!(Test-Path $bench)) { throw "Path benchmark executable not found: $bench" }
          $tools = Join-Path $dist "tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Copy-Item $bench $tools
          @'
          TurboView path storage benchmark
          =================================

          Open PowerShell in this tools directory and run:
            .\pathbench.exe 100000
            .\pathbench.exe 1000000

          This synthetic benchmark compares Vec<PathBuf>, Vec<Arc<Path>>,
          and PathStore + PathId. It is not a substitute for measuring a real
          photo library. Run on the target PC and repeat each size three times.
          Record CPU, RAM, Windows version, and whether the library is on HDD,
          SATA SSD, NVMe, or a network share.
          '@ | Set-Content -Encoding UTF8 (Join-Path $tools "BENCHMARK-README.txt")
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "README.md") $dist
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "LICENSE.md") $dist
          @'
          TurboView - Windows x64 Portable
          =================================

          Run turboview.exe directly. No Rust or Cargo installation is required.
          Keep the executable and the accompanying license/readme files together.

          This package is built from the exact commit selected by this workflow.
          Windows system graphics components and a compatible Microsoft Visual C++
          runtime may still be provided by Windows or need to be installed separately.
          '@ | Set-Content -Encoding UTF8 (Join-Path $dist "PORTABLE-README.txt")
          $manifest = @()
          Get-ChildItem -File -Recurse $dist | ForEach-Object {
            $relative = $_.FullName.Substring($dist.Length + 1).Replace('\', '/')
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            $manifest += "$hash  $relative"
          }
          @"
          TurboView portable package SHA-256
          Commit: $env:GITHUB_SHA
          Workflow run: $env:GITHUB_RUN_ID

          $($manifest -join "`n")
          "@ | Set-Content -Encoding UTF8 (Join-Path $dist "SHA256SUMS.txt")

      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: TurboView-Windows-x64-portable
          path: ${{ runner.temp }}/TurboView-portable/
          if-no-files-found: error
          retention-days: 30

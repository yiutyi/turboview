name: Windows Rust CI

on:
  push:
    branches: [main, "perf/**"]
  pull_request:
    branches: [main]
    paths:
      - "turboview/**"
      - ".github/workflows/windows-ci.yml"

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: turboview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Add vendored NASM to PATH
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE\turboview\third-party\nasm\nasm-2.16.03" >> $env:GITHUB_PATH

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: turboview

      - name: Configure libjpeg-turbo
        working-directory: .
        run: >
          cmake -G Ninja -S . -B build-turbo
          -DCMAKE_BUILD_TYPE=Release
          -DWITH_SIMD=ON
          -DWITH_TURBOJPEG=ON
          -DENABLE_SHARED=OFF
          -DENABLE_STATIC=ON
          -DWITH_CRT_DLL=ON
          -DWITH_JAVA=OFF
          -DWITH_FUZZ=OFF
          -DWITH_TOOLS=OFF
          -DWITH_TESTS=OFF

      - name: Build libjpeg-turbo static library
        working-directory: .
        run: cmake --build build-turbo --config Release --target turbojpeg-static --parallel 4

      - name: Compile experimental WIC decoder
        run: cargo check --features wic-decode --locked

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build release application
        run: cargo build --release --locked

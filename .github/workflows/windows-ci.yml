name: Windows Rust CI

on:
  push:
    branches: [main, "perf/**"]
  pull_request:
    branches: [main]
    paths:
      - "turboview/**"
      - ".github/workflows/windows-ci.yml"

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format and test (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: turboview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: turboview

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run tests
        run: cargo test --locked
